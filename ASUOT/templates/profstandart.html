{% extends 'base.html' %}{% block content %}
<h1>База профстандартов РФ (актуально на 2026 г.)</h1>
<div class="card"><form><input name="q" value="{{q}}" placeholder="Поиск по наименованию/номеру ПСП"> <button>Найти</button></form></div>
<div class="card"><table><tr><th>Номер ПСП</th><th>Профессия/должность</th><th>Обобщённая трудовая функция</th><th>Ур.кв.</th><th>Вредные/опасные</th></tr>
{% for p in items %}<tr><td>{{p.code}}</td><td>{{p.name}}</td><td>{{p.title}}</td><td>{{p.level}}</td>
<td>{{'✅ ТОТ' if p.hazardous else '—'}}</td></tr>{% endfor %}</table></div>
{% endblock %}
