{% extends 'base.html' %}{% block content %}
<div class="card" style="max-width:400px;margin:60px auto">
<h1>Вход в АСУ ОТ</h1><p style="color:var(--muted)">Управление охраной труда по требованиям законодательства РФ</p>
{% if error %}<div class="flash red">{{ error }}</div>{% endif %}
<form method="post"><label>Логин</label><input name="username" style="width:100%" required>
<label>Пароль</label><input type="password" name="password" style="width:100%;margin-bottom:10px" required>
<button>Войти</button></form>
<p style="font-size:12px;color:var(--muted)">Демо-доступ: admin/admin123, engineer/engineer123, worker/worker123</p>
</div>{% endblock %}
